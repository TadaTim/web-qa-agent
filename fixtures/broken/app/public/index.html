<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Northwind Supply — Sample Shop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/products">Northwind Supply</a>
    <nav class="main-nav">
      <a href="#/products" data-testid="nav-shop">Shop</a>
      <a href="#/promos" data-testid="nav-promos">Promotions</a>
      <a href="#/cart" data-testid="nav-cart">Cart <span class="cart-badge" data-testid="cart-count">0</span></a>
      <a href="#/account" data-testid="nav-account">Account</a>
      <span class="auth-area" data-testid="auth-area"></span>
    </nav>
  </header>
  <main id="view" class="view-container"></main>
  <footer class="site-footer">
    <p>Demo storefront for automated QA. Partner store: <a href="https://example.com/partner" data-testid="partner-link">example.com</a></p>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
